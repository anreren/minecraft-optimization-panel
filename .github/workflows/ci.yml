name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: npm install
      - name: Enable shmem THP for ZGC tests
        run: |
          if [ -w /sys/kernel/mm/transparent_hugepage/shmem_enabled ]; then
            echo advise > /sys/kernel/mm/transparent_hugepage/shmem_enabled || true
          elif command -v sudo >/dev/null 2>&1; then
            echo advise | sudo tee /sys/kernel/mm/transparent_hugepage/shmem_enabled >/dev/null || true
          fi
      - run: npm test

  graalvm:
    name: JVM flags on Oracle GraalVM (${{ matrix.java }})
    runs-on: ubuntu-latest
    # Experimental: checks the Graal-specific flags on a real GraalVM.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install
      - name: Enable shmem THP for ZGC tests
        run: |
          if [ -w /sys/kernel/mm/transparent_hugepage/shmem_enabled ]; then
            echo advise > /sys/kernel/mm/transparent_hugepage/shmem_enabled || true
          elif command -v sudo >/dev/null 2>&1; then
            echo advise | sudo tee /sys/kernel/mm/transparent_hugepage/shmem_enabled >/dev/null || true
          fi
      - run: npm run test:browser && npm run test:jvm
